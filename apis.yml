- name: Factiva Code API
  description: Enables retrieval of codes necessary to search for companies, currencies, exchanges, locations, industries,
    instruments, and news subjects within Factiva. Each data item is identified by a unique Factiva Code and supports
    lookups by Dow Jones Ticker, CUSIP, DUNS, and ISIN identifiers.
