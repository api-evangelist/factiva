entries:
  - date: '2026-03'
    surface: Factiva Streams
    version: '3.1'
    type: addition
    breaking: false
    highlights:
      - Added includesList and excludesList parameters when creating a Stream, filtering content in or out for code fields previously added to a stream-type list.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-streams-streams_3_0
  - date: '2025-12'
    surface: Factiva Taxonomy list download
    type: addition
    breaking: false
    highlights:
      - Added the `extended` parameter when downloading the companies taxonomy list.
      - Added a new set of attributes to the companies taxonomy list when extended=true.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-taxonomy_list_download
  - date: '2025-11'
    surface: Factiva Taxonomy list download
    type: addition
    breaking: false
    highlights:
      - Added `json` as a supported file format.
      - Introduced the `extended` parameter for downloading the regions taxonomy list.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-taxonomy_list_download
  - date: '2025-08-26'
    surface: Factiva Bulk Source Events
    type: addition
    breaking: false
    highlights:
      - First public-facing version of GET /extractions/bulk-events.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-bulk_source_events
  - date: '2025-07'
    surface: Factiva Retrieval API
    version: '1.0'
    type: release
    breaking: false
    highlights:
      - First public-facing version of the Retrieval endpoint (RAG-oriented licensed article retrieval).
      - First public-facing version of the Usage Metrics endpoint.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_retrieval_api-endpoints-retrieval
  - date: '2025-07'
    surface: Factiva Snapshots / Streams
    version: '3.0 / 2.44'
    type: addition
    breaking: false
    highlights:
      - New parameter on the request that monitors Snapshot status (Snapshots Extended Status).
      - New parameter on the request that retrieves Stream information (Streams Extended Status).
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-snapshots-snapshots_3_0
  - date: '2025-05'
    surface: Factiva Streams
    type: addition
    breaking: false
    highlights:
      - Introduced bulk events, starting with source_delete events instructing removal of all content for a source code.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-streams
  - date: '2025-03'
    surface: Factiva Snapshots (Analytics)
    version: '3.0'
    type: change
    breaking: true
    highlights:
      - The format of Analytics data changed from JSON to JSON Lines, changing the response data schema.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-snapshots-snapshots_3_0
  - date: '2025-01'
    surface: Factiva Snapshots (Time Series)
    version: '3.0 / 2.44'
    type: change
    breaking: true
    highlights:
      - The `group_dimensions` body parameter changed data type — from an array accepting up to four values to a string limited to one value.
      - New `availability_datetime` attribute on the Snapshot creation response.
      - Added the use of Lists on Snapshots Explains and Snapshots Analytics.
    source: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-snapshots-snapshots_2_0
  - date: '2024-09'
