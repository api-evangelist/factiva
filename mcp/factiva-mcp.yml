constraints:
  - >-
    Every tool would require an authenticated bearer token; there is no anonymous Factiva surface,
    and content entitlement is provisioned per contract.
  - >-
    Factiva content is licensed. The published GenAI usage guidelines require per-transaction
    usage reporting (user_id / work_id) when article text is passed to an LLM, which any real MCP
    server over this content would have to carry.
  - >-
    The Snapshots, Streams, Extractions, Analytics, Taxonomy and Retrieval surfaces have no
    published spec, so they are absent from this derivation even though they are the products
    most agents would want.
