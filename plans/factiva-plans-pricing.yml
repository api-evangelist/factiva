description: >-
  Factiva publishes no plans and no prices. There is no tier list, no price page, no per-call
  rate card and no self-service checkout anywhere on dowjones.com or on the Dow Jones Developer
  Platform. Every route to the API ends at a sales conversation: the documented onboarding is
  "submit the Request Trial form, wait for a Dow Jones representative to reach out and match your
  use case to a product, then receive credentials by email". The product page routes to
  /contact/sales-inquiry/?product=Factiva. This file records that zero, deliberately, rather than
  leaving the artifact absent — an enterprise-only commercial model is a real finding about how
  the API can be adopted.
plan_count: 0
plans: []
pricing_model: enterprise-negotiated
public_pricing: false
self_service_signup: false
free_tier: false
trial:
  available: true
  type: sales-qualified
  self_service: false
  url: https://developer.dowjones.com/request-trial
  note: >-
    The "trial" is a lead form, not a sandbox. No credentials are issued without a Dow Jones
    representative first matching the use case to a product.
onboarding:
  steps:
    - Submit the Request Trial form on developer.dowjones.com.
    - A Dow Jones representative makes contact and matches the use case to a product.
    - The customer selects the products to use.
    - Credentials arrive by email.
  docs: https://developer.dowjones.com/documents/site-docs-getting_started-quick_start-getting_credentials
sales_contact:
  url: https://www.dowjones.com/contact/sales-inquiry/?product=Factiva
metering:
  note: >-
    Factiva does meter usage, it just does not publish the price of it. The GenAI surface exposes
    consumption reporting to the customer — POST /content/gen-ai/token-usage returns tokens
    consumed over a period, and the deprecated usage-metrics endpoint returned the accession
    numbers retrieved. Article consumption is deduplicated on a 24-hour rule (not yet applied to
    the token-usage figures per the endpoint's own caveat). What a token or an article costs is
    contractual.
  endpoints:
    - POST https://api.dowjones.com/content/gen-ai/token-usage
    - POST https://api.dowjones.com/content/gen-ai/usage-metrics (deprecated)
  docs: https://developer.dowjones.com/documents/factiva_integration-factiva_retrieval_api-endpoints-token-usage
