description: >-
  HTTP-level error contract for the Factiva API surface, derived from the 4xx/5xx responses in
  the three harvested specs and corroborated with the documented Retrieval error handling plus
  one live unauthenticated probe. Factiva does NOT use RFC 9457 problem+json; it uses a
  JSON:API-shaped `errors[]` envelope, and the Newsletters API returns it under the
  `application/vnd.api+json` media type.
format: json-api-errors
rfc9457: false
media_types:
  - application/json
  - application/vnd.api+json
envelope:
  root: errors
  cardinality: array
  fields:
    - name: code
      type: string
      description: Numeric Dow Jones error code. See errors/factiva-error-codes.yml for the published registry.
    - name: title
      type: string
      description: Short human-readable summary of the error.
    - name: status
      type: string
      description: HTTP status code, repeated in the body.
    - name: detail
      type: string
      description: Longer explanation of this specific occurrence. Not always present.
  example: |
    {
      "errors": [
        {
          "code": "950012",
          "title": "Gen-ai Malformed Request ",
          "status": "400",
          "detail": "Malformed Request The search filter scope should be valid"
        }
      ]
    }
  example_source: https://developer.dowjones.com/documents/factiva_integration-factiva_retrieval_api-endpoints-retrieval
