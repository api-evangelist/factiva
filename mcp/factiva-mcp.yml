description: >-
  Dow Jones publishes no Model Context Protocol server for Factiva. This is a CANDIDATE tool list
  derived from the operations in the three harvested Factiva specs — a design sketch of what an
  MCP server over Factiva would expose, not something anyone can call. Every tool below names the
  backing operation so the input contract can be read from the spec rather than guessed.
