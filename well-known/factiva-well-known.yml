      - path: /.well-known/agent.json
        status: 404
  - host: https://accounts.dowjones.com
    note: Dow Jones identity service; the token endpoint documented for Factiva token-based authentication.
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: factiva-openid-configuration.json
      - path: /.well-known/jwks.json
        status: 200
