method: probed
source: live HTTP probes of every Factiva/Dow Jones host named in apis.yml and in the harvested OpenAPI servers[]
description: >-
  Well-known discovery probe for the Factiva API surface. The Factiva APIs are served from
  api.dowjones.com and authenticated through the Dow Jones identity service at
  accounts.dowjones.com (sso.accounts.dowjones.com), which is the host documented in the
  Factiva Integration authentication page for the token-based flow. Only accounts.dowjones.com
  serves a real well-known document; every other path probed returned 404. Note that the
  developer portal and the marketing site answer 404 with a full HTML page, which is a
  soft-404 shell and NOT a served document.
hosts:
