- name: Factiva Content API
  description: Search the Factiva archive and retrieve licensed articles by accession number, including binary renditions
    (PDF, image) and publisher redirects. Also covers alert result retrieval, NewsPlus collections, newsletter edition
    content, realtime search, and entity-scoped search by company, person or portfolio. This is the surface Factiva
    documents as Factiva Article Fetch / the Factiva Content Endpoint.
