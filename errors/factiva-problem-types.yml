gaps:
  - >-
    No 429 is declared on any operation and no rate-limit error is documented, which is
    consistent with the absence of any published rate limit.
  - >-
    The Content API (Swagger 2.0) declares 4xx/5xx status codes with a description but no
    response schema, so an agent cannot bind the error body from that document alone.
  - >-
    The unauthenticated status diverges between spec (401) and gateway (403).
