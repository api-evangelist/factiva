      - GET /refs/{ref}/redirect
  - file: factiva-read-newsletter-editions.md
    name: Read Factiva newsletters and their editions
    api: openapi/factiva-newsletters-api-openapi.json
    operations: [NewslettersRead, NewsletterReadById, EditionsRead, EditionReadById]
