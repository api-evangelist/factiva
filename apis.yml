name: Factiva
description: 'Factiva is Dow Jones'' business information and research service, providing licensed access to a global
  news and data archive drawn from more than 33,000 sources across 200 countries and 28 languages. Its API suite
  lets organizations search and retrieve licensed articles, run one-time historical extractions (Snapshots), subscribe
  to real-time filtered news streams over Google Cloud Pub/Sub, resolve the ~350,000-code Dow Jones Intelligent
  Identifiers taxonomy of companies, industries, regions and news subjects, and feed copyright-compliant content
  into retrieval-augmented generation stacks. Access is contract-based: there is no self-service signup and no published
  pricing, and credentials are issued by Dow Jones after a trial request.'
