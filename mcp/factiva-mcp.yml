      http_status: 404
    - url: https://developer.dowjones.com/mcp
      http_status: 404
  note: >-
    Dow Jones does address the AI-agent use case, but through licensed content APIs (Factiva
    Retrieval for RAG, the AI News Feed) rather than through MCP. Do not confuse this with
    FactSet, a different company, which does ship an MCP server.
