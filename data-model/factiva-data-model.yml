taxonomy:
  name: Dow Jones Intelligent Identifiers (DJID)
  scale: >-
    Approximately 350,000 taxonomy codes covering industries, regions, news subjects, companies
    and organizations.
  download: GET /taxonomies/{taxonomy_category}/{format}?extended={value}
  formats: [csv, avro, json]
  docs: https://developer.dowjones.com/documents/factiva_integration-factiva_analytics-endpoints-taxonomy_list_download
notes:
  - >-
    The identifier vocabulary is the actual product. Query, filter, stream and snapshot all bind
    to the same code sets, which is why the Taxonomy and Code endpoints are prerequisites for
    every other surface.
  - >-
    The Newsletters API is the only Factiva surface that models relationships explicitly, because
    it is the only one that publishes a JSON:API document.
