source: https://developer.dowjones.com/documents/site-docs-factiva_apis-factiva_workflow_apis_soap-soap-error_codes_and_messages
description: The published Factiva numeric error-code registry, harvested from the Dow Jones Developer
  Platform troubleshooting pages. Dow Jones documents these under the Factiva Workflow (SOAP/FDK) section,
  but the same numeric code families surface on the live REST gateway — an unauthenticated call to api.dowjones.com
  returns code 1011001, and the Factiva Retrieval GenAI endpoint documents code 950012 — so this is the
  error vocabulary of the platform, not only of the legacy SOAP surface. Each code carries a type of Client
  (the caller must change the request) or Server (retry or contact support). Dow Jones explicitly recommends
  customizing the MESSAGES for end users but never the CODES.
envelope: errors[] with code / title / status / detail — see errors/factiva-problem-types.yml
note: The SOAP FDK surface these pages were written for is deprecated and largely sunset (see lifecycle/factiva-lifecycle.yml);
  the code registry itself remains the published reference and is still the only enumerated error vocabulary
  Factiva publishes.
