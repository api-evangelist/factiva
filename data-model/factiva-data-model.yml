docs: https://developer.dowjones.com/documents/factiva_integration-essentials-query_language_building_queries
description: >-
  The Factiva entity graph, derived from the $ref links and JSON:API relationship objects in the
  harvested specs and from the identifier vocabulary the documentation describes. Factiva's data
  model is a single content core — the Article — hung off a controlled taxonomy of Dow Jones
  Intelligent Identifiers (DJID / Factiva codes) for companies, industries, regions, news
  subjects, people, currencies and market indexes. Everything else (search, alerts, newsletters,
  streams, snapshots) is a different projection over that same core.
entities:
  - name: Article
    aka: [Content Item, Document]
    identifier: an
    identifier_name: Accession Number
    identifier_format: >-
      Alphanumeric string, e.g. NFINCE0020251008ela8005aj — encodes source code, ingestion date
      and a sequence.
    description: The unit of Factiva content. Also carries images, PDFs and HTML renditions.
    key_fields:
      - an
      - title
      - body
      - source_code
      - publication_datetime
      - modification_datetime
      - availability_datetime
      - ingestion_datetime
      - language_code
      - copyright
      - word_count
    sources:
      - openapi/factiva-content-api-swagger.json#/refs/{ref}
      - asyncapi/factiva-streams-events.yml
  - name: Source
    identifier: source_code
    description: The publication that produced an article (WSJ, LBA, ELECON …).
    note: >-
      A source_delete bulk event on Streams removes every article carrying that source_code —
      the only cascade Factiva asks consumers to implement themselves.
  - name: Company
    identifier: company_code
    aka: [Factiva Code, FCode]
    alternate_identifiers: [Dow Jones Ticker, CUSIP, DUNS, ISIN]
    description: Organization in the Factiva taxonomy; the join key for company news and screening.
  - name: Industry
    identifier: industry_code
    description: Industry classification in the DJID taxonomy; hierarchical (children lookups exist).
  - name: Region
    identifier: region_code
    description: Geographic classification in the DJID taxonomy; hierarchical.
  - name: NewsSubject
    identifier: subject_code
    description: Subject/topic classification in the DJID taxonomy; hierarchical.
  - name: Person
    identifier: person_code
    description: Executive/person entity in the taxonomy.
  - name: Currency
    identifier: currency_code
  - name: MarketIndex
    identifier: market_index_code
  - name: Newsletter
    identifier: id
    type: newsletters
    description: A curated Factiva newsletter available to the account.
    key_fields: [name, token, shared_status, access_scope, is_owner, total_editions, user_type]
    enums:
      shared_status: [User, Account, Factiva]
      access_scope: [Personal, Account]
      user_type: [Account, Group, User]
    sources: [openapi/factiva-newsletters-api-openapi.json#newsletter_attributes]
  - name: NewsletterEdition
    identifier: editionId
    type: editions
    description: One dated issue of a newsletter, composed of sections and content items.
  - name: NewsletterDelivery
    type: deliveries
    description: A delivery of a newsletter edition to an audience/recipient set.
  - name: Alert
    identifier: id
    description: A saved Factiva alert whose matched articles can be retrieved by id.
    sources:
      - openapi/factiva-content-api-swagger.json#/alerts/{id}
  - name: NewsPlusCollection
    identifier: code
    description: A NewsPlus collection of curated content.
  - name: StreamingInstance
    aka: [Topic, Stream]
    description: A hosted real-time filter over the ingestion pipeline, defined by a SQL-like query.
    sources: [asyncapi/factiva-streams-events.yml]
  - name: Subscription
    description: A Google Cloud Pub/Sub delivery endpoint attached to a Streaming Instance.
  - name: Snapshot
    description: A one-time extraction of historical Factiva content matching a query.
  - name: List
    description: >-
      A reusable set of codes (company, subject, region …) referenced by Snapshots, Streams and
      Explains. Typed since 3.1 (listType), clonable, with listSize reported.
