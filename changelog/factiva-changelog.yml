generated: '2026-08-13'
method: searched
source: https://developer.dowjones.com/documents/factiva_integration
description: >-
  Factiva does not publish a single platform changelog. Each endpoint family publishes its own
  "Revision History" table inside its documentation page, dated by month and keyed to the API
  version served through the X-API-VERSION header. This artifact consolidates the recent window
  of those per-endpoint histories into one dated view. Changes are announced to customers by
  email through the Factiva Integration Suite product-update and deprecation lists.
scheme: per-endpoint-version-history
version_format: >-
  Two-part number (major.minor). Major may include breaking changes; minor is backward-compatible.
  Selected with the X-API-VERSION request header, or with an Accept vendor media type
  (application/vnd.dowjones.genai-content.v_N.N) on the GenAI endpoints.
current_versions:
  factiva_streams: '3.1'
  factiva_snapshots: '3.0'
  factiva_lists: '3.1'
  factiva_company_mapping: '3.0'
  factiva_taxonomy_download: 'dated (Dec 2025)'
  factiva_retrieval: '1.0'
  factiva_sentiment_signals: '1.0'
  factiva_genai_article_usage: '1.0'
announcements:
