description: >-
  First-party Factiva client libraries. Dow Jones publishes them from the github.com/dowjones
  organization. The currency picture is the finding here: the only package with a 2026 release is
  `dnastreaming` (the Streams client). The three `factiva-*` Python packages that wrap Snapshots,
  Streams, Analytics and Taxonomy last shipped in 2022, and the JavaScript siblings were never
  published to npm at all — @factiva/core and @factiva/news exist only as GitHub source, and
  dj-dna-streaming-javascript was published to npm in 2017 and then unpublished. An integrator on
  JavaScript has no installable first-party client.
